<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Ciclo de uma requisição REST</title>
  <desc id="description">A chamada segue do cliente ao controller, service, repository e banco; a resposta JSON retorna ao cliente.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 700 19px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .detail { font: 15px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .number { font: 700 14px Arial, Helvetica, sans-serif; fill: #0b1220; }
      .small { font: 15px Arial, Helvetica, sans-serif; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#background)"/>
  <text x="44" y="52" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#fff">Como uma consulta atravessa a API</text>
  <text x="44" y="80" class="small">Exemplo: GET /api/produtos/42</text>

  <g fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M209 190h25"/><path d="M399 190h25"/><path d="M589 190h25"/>
    <path d="M779 190h25"/><path d="M969 190h25"/>
  </g>

  <g>
    <rect x="44" y="126" width="165" height="128" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="66" cy="148" r="13" fill="#38bdf8"/><text x="66" y="153" text-anchor="middle" class="number">1</text>
    <text x="126" y="178" text-anchor="middle" class="label">Cliente</text>
    <text x="126" y="207" text-anchor="middle" class="detail">React / navegador</text>
    <text x="126" y="230" text-anchor="middle" class="detail">ou Postman</text>

    <rect x="234" y="126" width="165" height="128" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <circle cx="256" cy="148" r="13" fill="#818cf8"/><text x="256" y="153" text-anchor="middle" class="number">2</text>
    <text x="316" y="178" text-anchor="middle" class="label">Controller</text>
    <text x="316" y="207" text-anchor="middle" class="detail">Rota e HTTP</text>
    <text x="316" y="230" text-anchor="middle" class="detail">entrada / saída</text>

    <rect x="424" y="126" width="165" height="128" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="446" cy="148" r="13" fill="#a78bfa"/><text x="446" y="153" text-anchor="middle" class="number">3</text>
    <text x="506" y="178" text-anchor="middle" class="label">Service</text>
    <text x="506" y="207" text-anchor="middle" class="detail">Regras de</text>
    <text x="506" y="230" text-anchor="middle" class="detail">negócio</text>

    <rect x="614" y="126" width="165" height="128" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <circle cx="636" cy="148" r="13" fill="#34d399"/><text x="636" y="153" text-anchor="middle" class="number">4</text>
    <text x="696" y="178" text-anchor="middle" class="label">Repository</text>
    <text x="696" y="207" text-anchor="middle" class="detail">Spring Data</text>
    <text x="696" y="230" text-anchor="middle" class="detail">JPA</text>

    <rect x="804" y="126" width="165" height="128" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="826" cy="148" r="13" fill="#fbbf24"/><text x="826" y="153" text-anchor="middle" class="number">5</text>
    <text x="886" y="178" text-anchor="middle" class="label">Banco</text>
    <text x="886" y="207" text-anchor="middle" class="detail">Consulta ou</text>
    <text x="886" y="230" text-anchor="middle" class="detail">gravação</text>

    <rect x="994" y="126" width="165" height="128" rx="14" fill="#1e293b" stroke="#fb7185" stroke-width="2"/>
    <circle cx="1016" cy="148" r="13" fill="#fb7185"/><text x="1016" y="153" text-anchor="middle" class="number">6</text>
    <text x="1076" y="178" text-anchor="middle" class="label">Resposta</text>
    <text x="1076" y="207" text-anchor="middle" class="detail">DTO serializado</text>
    <text x="1076" y="230" text-anchor="middle" class="detail">JSON + HTTP</text>
  </g>

  <path d="M1080 286H120" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <text x="600" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#86efac">Retorno: dados → service → controller → cliente</text>
  <rect x="310" y="346" width="580" height="42" rx="21" fill="#14532d"/>
  <text x="600" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#dcfce7">200 OK + JSON  |  404 Not Found quando o recurso não existe</text>
</svg>
